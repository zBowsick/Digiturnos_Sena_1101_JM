<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Turno</title>
    <link rel="stylesheet" href="style(2).css">
    <style>
        .confirmation-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .confirmation-details {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .confirmation-title {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .detail-item {
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h1 class="confirmation-title">Confirmación de Turno</h1>
        <div class="confirmation-details">
            <div class="detail-item">
                <strong>Nombre:</strong> <span id="nombrePaciente"></span>
            </div>
            <div class="detail-item">
                <strong>Atención Médica:</strong> <span id="tipoAtencion"></span>
            </div>
            <div class="detail-item">
                <strong>Fecha:</strong> <span id="fechaTurno"></span>
            </div>
            <div class="detail-item">
                <strong>Hora:</strong> <span id="horaTurno"></span>
            </div>
        </div>
        <button onclick="window.location.href='index(2).html'" class="nextBtn" style="width: 100%;">
            Volver al inicio
        </button>
    </div>

    <script>
        // Obtener parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        
        // Mostrar los detalles en la página
        document.getElementById('nombrePaciente').textContent = params.get('nombre');
        document.getElementById('tipoAtencion').textContent = params.get('atencion');
        document.getElementById('fechaTurno').textContent = params.get('fecha');
        document.getElementById('horaTurno').textContent = params.get('hora');

        // Guardar el turno en la base de datos
        async function guardarTurno() {
            try {
                const response = await fetch('guardar_turno.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        nombre: params.get('nombre'),
                        atencion: params.get('atencion'),
                        fecha: params.get('fecha'),
                        hora: params.get('hora')
                    })
                });
                
                if (!response.ok) {
                    console.error('Error al guardar el turno');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Guardar el turno cuando se carga la página
        window.onload = guardarTurno;
    </script>
</body>
</html>
