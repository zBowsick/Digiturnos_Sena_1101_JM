<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador - Gestión de Turnos</title>
    <link rel="stylesheet" href="style(2).css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .turnos-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .turnos-table th, .turnos-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .turnos-table th {
            background-color: #4070f4;
            color: white;
        }
        .action-buttons button {
            padding: 5px 10px;
            margin: 0 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .edit-btn {
            background-color: #ffc107;
            color: #000;
        }
        .delete-btn {
            background-color: #dc3545;
            color: #fff;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header-actions">
            <h1>Panel de Administrador - Gestión de Turnos</h1>
            <button onclick="window.location.href='index (1).html'" class="nextBtn">Cerrar Sesión</button>
        </div>
        
        <table class="turnos-table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Atención Médica</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="turnosTableBody">
                <!-- Los turnos se cargarán aquí dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        // Función para cargar los turnos desde la base de datos
        async function cargarTurnos() {
            try {
                const response = await fetch('obtener_turnos.php');
                const turnos = await response.json();
                
                const tbody = document.getElementById('turnosTableBody');
                tbody.innerHTML = '';
                
                turnos.forEach(turno => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${turno.nombre}</td>
                        <td>${turno.atencion}</td>
                        <td>${turno.fecha}</td>
                        <td>${turno.hora}</td>
                        <td>${turno.estado}</td>
                        <td class="action-buttons">
                            <button class="edit-btn" onclick="editarTurno(${turno.id})">Editar</button>
                            <button class="delete-btn" onclick="eliminarTurno(${turno.id})">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error al cargar los turnos:', error);
            }
        }

        async function editarTurno(id) {
            const nuevoEstado = prompt('Ingrese el nuevo estado del turno (Pendiente/Confirmado/Cancelado):');
            if (nuevoEstado) {
                try {
                    const response = await fetch('actualizar_turno.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            id: id,
                            estado: nuevoEstado
                        })
                    });
                    
                    if (response.ok) {
                        cargarTurnos();
                    } else {
                        alert('Error al actualizar el turno');
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        async function eliminarTurno(id) {
            if(confirm('¿Está seguro de que desea eliminar este turno?')) {
                try {
                    const response = await fetch('eliminar_turno.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ id: id })
                    });
                    
                    if (response.ok) {
                        cargarTurnos();
                    } else {
                        alert('Error al eliminar el turno');
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        // Cargar turnos al iniciar
        window.onload = cargarTurnos;
    </script>
</body>
</html>
